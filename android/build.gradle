// Define the group and version for your project
group = 'com.example.ivs_broadcaster'
version = '1.0'

// Configure buildscript repositories and dependencies
buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Update to the latest stable Android Gradle Plugin (AGP) version
        classpath 'com.android.tools.build:gradle:8.1.1'
    }
}

// Ensure all projects use the necessary repositories
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Apply the Android library plugin
apply plugin: 'com.android.library'

android {
    // Specify the namespace for the module
    namespace 'com.example.ivs_broadcaster'

    // Update to the latest compile SDK version
    compileSdkVersion 33

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 21
    }

    dependencies {
        // Unit testing dependencies
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.mockito:mockito-core:5.0.0'

        // Implementation dependencies
        implementation 'com.amazonaws:ivs-broadcast:1.10.0'
        implementation 'androidx.appcompat:appcompat:1.6.1'
        implementation 'com.google.android.material:material:1.9.0'
    }

    testOptions {
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}
